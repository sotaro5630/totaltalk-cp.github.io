<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ツアー予約サイト</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>ツアー予約フォーム</h1>

<div id="user-form">
    <label>名前：</label>
    <input type="text" id="name"><br>

    <label>人数：</label>
    <input type="number" id="people" min="1" max="15"><br>

    <button onclick="submitReservation()">予約する</button>
</div>

<div id="result" class="hidden"></div>

<hr>

<h2>管理者ログイン</h2>
<input type="password" id="admin-pass" placeholder="パスワードを入力">
<button onclick="adminLogin()">ログイン</button>

<div id="admin-page" class="hidden">
    <h2>予約一覧</h2>
    <table>
        <thead>
            <tr>
                <th>名前</th>
                <th>人数</th>
                <th>ツアー時間</th>
            </tr>
        </thead>
        <tbody id="reservation-table"></tbody>
    </table>
</div>

<script src="script.js"></script>
</body>
</html>
